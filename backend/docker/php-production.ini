; php.ini de producción (Dockerfile.render), M-1 de la revisión de seguridad
; de 005. Se copia a $PHP_INI_DIR/conf.d/.
;
; Fotos de activos (FR-008): hasta 4 MB por archivo (AssetPhotoRules; el
; proxy de Vercel corta en ~4,5 MB por petición) y 24 megapíxeles. GD reserva
; ~4 bytes por píxel al decodificar (~96 MB para 24 Mpx) más la copia
; escalada: 256M deja margen sin permitir que una petición agote el servidor.

memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M

; Sin detalles de PHP hacia afuera.
expose_php = Off
display_errors = Off
log_errors = On

; R-2 (revisión de seguridad de 008): una petición no ocupa el proceso más de
; 60 s (p. ej. un PDF grande). El tope de filas de ReportResponder evita
; llegar aquí en un uso normal (SC-001: 1 000 filas en menos de 10 s).
max_execution_time = 60
